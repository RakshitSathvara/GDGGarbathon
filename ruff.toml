line-length = 100
target-version = "py310"

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "B",    # flake8-bugbear
  "S",    # flake8-bandit (security)
  "UP",   # pyupgrade
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  "PT",   # flake8-pytest-style
  "RUF",  # ruff-specific
]
# The context block sent to Gemini uses an en dash between chunk times ("00:18.2–00:24.6").
allowed-confusables = ["–"]

[lint.per-file-ignores]
# Tests use bare asserts and throwaway temp paths by design.
"tests/**" = ["S101", "S108"]
